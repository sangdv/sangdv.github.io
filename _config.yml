# Cấu hình Jekyll — https://jekyllrb.com/docs/configuration/

title: CV/DL
description: Blog về thị giác máy tính, học sâu và công nghệ
url: https://sangdv.github.io
lang: vi

paginate: 9
paginate_path: "page:num"
excerpt_separator: "<!--more-->"

markdown: kramdown
highlighter: rouge
exclude: ["README.md", "Gemfile", "Gemfile.lock", "LICENSE"]

disqus: cvdl
# Điền mã đo lường GA4 (dạng G-XXXXXXX) để bật Google Analytics
google_analytics:

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      comments: true

author:
  name: SangDV
  email: sang.dinhviet@hust.edu.vn
  github: sangdv
  bio: Hanoi University of Science and Technology

rss_path: feed.xml
categories_path: categories.html
tags_path: tags.html

BASE_PATH:

plugins:
  - jekyll-paginate
